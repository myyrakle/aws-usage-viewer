[project]
name = "curhouse"
version = "0.1.0"
description = "AWS CUR 2.0 to local ClickHouse loader"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "clickhouse-connect>=0.7",
]

[project.scripts]
curhouse = "curhouse.cli:main"

[tool.uv]
package = true

# Only package the Python package tree. The repo root also has a non-Python
# `clickhouse/` dir (ClickHouse config for docker-compose), which would
# otherwise trip setuptools flat-layout auto-discovery ("Multiple top-level
# packages discovered"). This includes curhouse and its subpackages
# (curhouse.aws, curhouse.clickhouse, ...) while excluding it.
[tool.setuptools.packages.find]
include = ["curhouse*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "moto[s3]>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
