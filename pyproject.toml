[project]
name = "datahouse"
version = "0.1.0"
description = "AWS CUR 2.0 to local ClickHouse loader"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "clickhouse-connect>=0.7",
]

[project.scripts]
datahouse = "datahouse.cli:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "moto[s3]>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
