services:
  # CUR data warehouse. Kept in compose so it auto-restarts with the stack
  # (colima autostarts via brew services; restart policy brings this back).
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: curhouse-ch
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./ch-data:/var/lib/clickhouse
      - ./clickhouse/users.d/open-default.xml:/etc/clickhouse-server/users.d/open-default.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Metabase application DB — Postgres replaces the fragile H2 file DB.
  # H2 allows only one process to hold its file lock, so overlapping/rapid
  # restarts caused connection-timeout crash loops. Postgres removes that.
  metabase-db:
    image: postgres:16-alpine
    container_name: curhouse-metabase-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: metabase
    volumes:
      - ./metabase-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 5s
      timeout: 5s
      retries: 12

  metabase:
    image: metabase/metabase:latest
    container_name: curhouse-metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # kept mounted for the one-time H2->Postgres migration + as a backup source
      - ./metabase-data:/metabase-data
    environment:
      # Cap the JVM heap. By default Metabase sizes max heap to ~1/4 of the
      # container-visible RAM (~3.9G here), and reserving that on a
      # memory-saturated colima VM gets it OOM-killed at startup. 1G is plenty
      # for this small instance (ClickHouse does the heavy lifting).
      JAVA_OPTS: "-Xmx1g"
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: metabase
    depends_on:
      metabase-db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
