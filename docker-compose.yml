services:
  # Metabase application DB — Postgres replaces the fragile H2 file DB.
  # H2 allows only one process to hold its file lock, so overlapping/rapid
  # restarts caused connection-timeout crash loops. Postgres removes that.
  metabase-db:
    image: postgres:16-alpine
    container_name: curhouse-metabase-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: metabase
    volumes:
      - ./metabase-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 5s
      timeout: 5s
      retries: 12

  metabase:
    image: metabase/metabase:latest
    container_name: curhouse-metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # kept mounted for the one-time H2->Postgres migration + as a backup source
      - ./metabase-data:/metabase-data
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: metabase
    depends_on:
      metabase-db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
