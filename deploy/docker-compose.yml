services:
  metabase-db:
    image: postgres:16-alpine
    container_name: curhouse-metabase-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: metabase
    volumes:
      - metabase-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 5s
      timeout: 5s
      retries: 12

  metabase:
    image: metabase/metabase:latest
    container_name: curhouse-metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      JAVA_OPTS: "-Xmx1g"
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: metabase
    depends_on:
      metabase-db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  curhouse-sync-init:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: curhouse:latest
    container_name: curhouse-sync-init
    restart: "no"
    command: ["curhouse", "sync"]
    env_file: .env
    environment:
      CURHOUSE_CH_HOST: ${CURHOUSE_CH_HOST:-host.docker.internal}
      CURHOUSE_CH_PORT: ${CURHOUSE_CH_PORT:-8123}
      CURHOUSE_CH_USER: ${CURHOUSE_CH_USER:-default}
      CURHOUSE_STATE_PATH: /state/state.json
    volumes:
      # fail clearly if config.toml is missing instead of letting Docker
      # auto-create it as an empty directory (-> confusing IsADirectoryError)
      - type: bind
        source: ../config.toml
        target: /app/config.toml
        read_only: true
        bind:
          create_host_path: false
      - curhouse-state:/state
    extra_hosts:
      - "host.docker.internal:host-gateway"

  metabase-provision:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: curhouse:latest
    container_name: curhouse-metabase-provision
    restart: "no"
    command: ["python", "scripts/provision_metabase.py"]
    env_file: .env
    environment:
      MB_URL: http://metabase:3000
      CH_HOST: ${CURHOUSE_CH_HOST:-host.docker.internal}
      CH_PORT: ${CURHOUSE_CH_PORT:-8123}
      CH_USER: ${CURHOUSE_CH_USER:-default}
      CH_PASSWORD: ${CURHOUSE_CH_PASSWORD:-}
    depends_on:
      metabase:
        condition: service_healthy
      curhouse-sync-init:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"

  curhouse-sync:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: curhouse:latest
    container_name: curhouse-sync
    restart: unless-stopped
    command: ["/usr/local/bin/supercronic", "/app/crontab"]
    env_file: .env
    environment:
      CURHOUSE_CH_HOST: ${CURHOUSE_CH_HOST:-host.docker.internal}
      CURHOUSE_CH_PORT: ${CURHOUSE_CH_PORT:-8123}
      CURHOUSE_CH_USER: ${CURHOUSE_CH_USER:-default}
      CURHOUSE_STATE_PATH: /state/state.json
    volumes:
      # fail clearly if config.toml is missing instead of letting Docker
      # auto-create it as an empty directory (-> confusing IsADirectoryError)
      - type: bind
        source: ../config.toml
        target: /app/config.toml
        read_only: true
        bind:
          create_host_path: false
      - curhouse-state:/state
    depends_on:
      curhouse-sync-init:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  metabase-pg-data:
  curhouse-state:
